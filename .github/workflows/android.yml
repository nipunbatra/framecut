name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android.yml']
    tags: ['v*']
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # A release keystore keeps the signing fingerprint stable, which matters:
      # Google ties the Android OAuth client to the signing SHA-1, so an APK
      # signed with a throwaway key cannot sign in. Without the secret we still
      # build a debug APK so pull requests get checked.
      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — building an unsigned debug APK." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          FRAMECUT_KEYSTORE: ${{ github.workspace }}/mobile/android/release.keystore
          FRAMECUT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FRAMECUT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FRAMECUT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FRAMECUT_GOOGLE_CLIENT_ID_SUFFIX: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID_SUFFIX }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        id: apk
        run: |
          path="$(find app/build/outputs/apk -name '*.apk' | head -1)"
          echo "path=mobile/android/$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
          ls -lh "$path"

      - uses: actions/upload-artifact@v4
        with:
          name: framecut-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Tagging a release gives a permanent, shareable download URL.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "FrameCut ${{ github.ref_name }}" \
            --notes "Install the APK on Android. On iOS, builds are distributed through TestFlight." \
            || true
          gh release upload "${{ github.ref_name }}" \
            "${{ github.workspace }}/${{ steps.apk.outputs.path }}" --clobber
